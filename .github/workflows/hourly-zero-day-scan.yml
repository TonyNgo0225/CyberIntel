name: Hourly zero-day vulnerability scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberintel-hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CYBERINTEL_SPREADSHEET_ID: ${{ secrets.CYBERINTEL_SPREADSHEET_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cyberintel-service-account.json
      CYBERINTEL_LINKS_TAB: Links
      CYBERINTEL_APP_LIST_TAB: App List
      CYBERINTEL_EMAILS_TAB: Emails
      CYBERINTEL_VULNERABILITIES_TAB: CVEs
      CYBERINTEL_SCAN_STATE_TAB: ScanState
      EMAIL_SMTP_USERNAME: ${{ secrets.EMAIL_SMTP_USERNAME }}
      EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
      GEMINI_MODEL: gemini-3.6-flash
      GROQ_MODEL: openai/gpt-oss-120b
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare Google Sheets credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "")
          if not raw:
              raise SystemExit("Missing GOOGLE_SERVICE_ACCOUNT_JSON repository secret.")
          try:
              credentials = json.loads(raw)
          except json.JSONDecodeError as error:
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON.") from error
          if credentials.get("type") != "service_account":
              raise SystemExit("The Google credentials secret must be a service-account JSON key.")

          path = Path(os.environ["GOOGLE_APPLICATION_CREDENTIALS"])
          path.write_text(json.dumps(credentials), encoding="utf-8")
          path.chmod(0o600)
          PY

      - name: Scan tracked apps and email critical zero-days
        run: python cyberintel.py --monitor-app-list --write-sheet --max-articles 5

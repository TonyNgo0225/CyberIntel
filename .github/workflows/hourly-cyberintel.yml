name: Hourly CyberIntel inventory scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyberintel-hourly-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOOGLE_AI_STUDIO_API_KEY: ${{ secrets.GOOGLE_AI_STUDIO_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      CYBERINTEL_SPREADSHEET_ID: ${{ secrets.CYBERINTEL_SPREADSHEET_ID }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/cyberintel-service-account.json
      CYBERINTEL_INVENTORY_FILE: ${{ runner.temp }}/cyberintel-inventory.json
      CYBERINTEL_LINKS_TAB: Links
      CYBERINTEL_VULNERABILITIES_TAB: CVEs
      CYBERINTEL_SCAN_STATE_TAB: ScanState
      GEMINI_MODEL: gemini-3.6-flash
      GROQ_MODEL: openai/gpt-oss-120b
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare private configuration files
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CYBERINTEL_INVENTORY_JSON: ${{ secrets.CYBERINTEL_INVENTORY_JSON }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          credentials_raw = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "")
          if not credentials_raw:
              raise SystemExit("Missing GOOGLE_SERVICE_ACCOUNT_JSON repository secret.")
          try:
              credentials = json.loads(credentials_raw)
          except json.JSONDecodeError as error:
              raise SystemExit("GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON.") from error
          if credentials.get("type") != "service_account":
              raise SystemExit("The Google credentials secret must be a service-account JSON key.")

          inventory_raw = os.environ.get("CYBERINTEL_INVENTORY_JSON", "")
          if not inventory_raw:
              raise SystemExit("Missing CYBERINTEL_INVENTORY_JSON repository secret.")
          try:
              inventory = json.loads(inventory_raw)
          except json.JSONDecodeError as error:
              raise SystemExit("CYBERINTEL_INVENTORY_JSON is not valid JSON.") from error
          if not isinstance(inventory, dict) or not isinstance(inventory.get("assets"), list) or not inventory["assets"]:
              raise SystemExit("CYBERINTEL_INVENTORY_JSON must contain a non-empty assets list.")

          for target, payload in (
              (os.environ["GOOGLE_APPLICATION_CREDENTIALS"], credentials),
              (os.environ["CYBERINTEL_INVENTORY_FILE"], inventory),
          ):
              path = Path(target)
              path.write_text(json.dumps(payload), encoding="utf-8")
              path.chmod(0o600)
          PY

      - name: Scan tracked assets and update Google Sheets
        run: python cyberintel.py --monitor-inventory --write-sheet --max-articles 5 --inventory "$CYBERINTEL_INVENTORY_FILE"
